
<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta name="description"
          content="Contacta a equipa do Descobre o Porto.">
    <title>Contactos | Descobre o Porto</title>
</head>

<body>

    <header>
        <h1>Contactos</h1>

        <nav aria-label="Navegação principal">
            <a href="index.html">Início</a>
            <a href="locais.html">Locais a visitar</a>
            <a href="gastronomia.html">Gastronomia</a>
            <a href="contactos.html">Contactos</a>
            <a href="acessibilidade.html">Acessibilidade</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Entra em contacto connosco</h2>

            <p>
                Tens alguma dúvida sobre o Porto?
                Preenche o formulário abaixo.
            </p>

            <form action="#" method="get">

                <p>
                    <label for="nome">Nome:</label>
                    <input type="text" id="nome"
                           name="nome" required
                           minlength="2">
                </p>

                <p>
                    <label for="email">Email:</label>
                    <input type="email" id="email"
                           name="email" required>
                </p>

                <p>
                    <label for="telefone">Telefone:</label>
                    <input type="tel" id="telefone"
                           name="telefone"
                           pattern="[0-9]{9}"
                           title="Introduz 9 dígitos."
                           placeholder="912345678">
                </p>

                <p>
                    <label for="data">Data da visita:</label>
                    <input type="date" id="data"
                           name="data">
                </p>

                <p>
                    <label for="pessoas">
                        Número de pessoas:
                    </label>
                    <input type="number" id="pessoas"
                           name="pessoas"
                           min="1" max="20">
                </p>

                <p>
                    <label for="motivo">
                        Motivo do contacto:
                    </label>
                    <select id="motivo"
                            name="motivo" required>
                        <option value="">
                            Seleciona uma opção
                        </option>
                        <option value="turismo">
                            Informações turísticas
                        </option>
                        <option value="gastronomia">
                            Gastronomia
                        </option>
                        <option value="outro">
                            Outro assunto
                        </option>
                    </select>
                </p>

                <p>
                    <label for="mensagem">Mensagem:</label>
                    <textarea id="mensagem"
                              name="mensagem"
                              rows="5"
                              required></textarea>
                </p>

                <p>
                    <input type="checkbox"
                           id="privacidade"
                           name="privacidade"
                           required>
                    <label for="privacidade">
                        Compreendo que este formulário
                        é apenas uma demonstração.
                    </label>
                </p>

                <button type="submit">Enviar</button>
                <button type="reset">Limpar</button>

            </form>
        </section>
    </main>

    <footer>
        <p>Descobre o Porto - Projeto académico</p>
    </footer>

</body>
</html>
