<svg xmlns="http://www.w3.org/2000/svg"
     width="64"
     height="64"
     viewBox="0 0 64 64">

    <!-- Fundo -->
    <rect width="64"
          height="64"
          rx="14"
          fill="#17324D"/>

    <!-- Marcador de localização -->
    <path d="M32 10
             C24.5 10 19 15.5 19 23
             C19 33.5 32 50 32 50
             C32 50 45 33.5 45 23
             C45 15.5 39.5 10 32 10 Z"
          fill="#2B8CC4"/>

    <!-- Círculo interior -->
    <circle cx="32"
            cy="23"
            r="8"
            fill="#FFFFFF"/>

    <!-- Letra P -->
    <text x="32"
          y="27"
          text-anchor="middle"
          font-family="Arial, sans-serif"
          font-size="11"
          font-weight="bold"
          fill="#17324D">
        P
    </text>

    <!-- Linha ondulada a representar o rio Douro -->
    <path d="M14 54
             C20 50, 26 58, 32 54
             C38 50, 44 58, 50 54"
          fill="none"
          stroke="#F2C14E"
          stroke-width="3"
          stroke-linecap="round"/>
</svg>