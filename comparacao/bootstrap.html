
<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exemplo Bootstrap</title>

    <!-- Bootstrap 5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">

    <link rel="stylesheet" href="../CSS/comparacao.css">
</head>

<body class="pagina-demo">

    <!-- E7 - Cartão Bootstrap -->

    <article class="card demo-cartao">

        <div class="card-body">

            <h2 class="card-title">Ribeira do Porto</h2>

            <img
                src="../imagens/ribeira.jpg"
                class="card-img-top demo-imagem"
                alt="Casas tradicionais na Ribeira do Porto">

            <p class="card-text">
                A Ribeira é uma das zonas mais conhecidas
                da cidade, situada junto ao rio Douro.
            </p>

        </div>

    </article>

</body>
</html>
