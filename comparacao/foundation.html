
<!DOCTYPE html>
<html lang="pt-PT">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Exemplo Foundation</title>

    <!-- Foundation 6.9.0 -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/foundation-sites@6.9.0/dist/css/foundation.min.css">

    <link rel="stylesheet" href="../CSS/comparacao.css">

<body class="pagina-demo">
